name: Update Human Rating & OCHMO Sitemaps

on:
  schedule:
    # Run weekly every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemaps:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Human Rating Crawler & Generate Sitemaps
        run: |
          python generate_human_rating_sitemap.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add human_rating_sitemap.xml human_rating_pdf_sitemap.xml imm_sitemap.xml human_rating_urls.txt
          if git diff --staged --quiet; then
            echo "No changes detected in sitemaps."
          else
            git commit -m "Automated update of Human Rating & OCHMO sitemaps [skip ci]"
            git push origin main
          fi
